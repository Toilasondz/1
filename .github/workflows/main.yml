name: Build VideoStarTool

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ~/theos
          key: theos-macos15-v1

      - name: Setup Theos & iOS SDK
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          brew install ldid xz
          git clone --recursive https://github.com/theos/theos.git ~/theos
          curl -LO https://github.com/theos/sdks/archive/master.zip
          unzip -q master.zip
          mv sdks-master/*.sdk ~/theos/sdks/
          rm -rf master.zip sdks-master

      - name: Compile VideoStarTool.dylib
        env:
          THEOS: /Users/runner/theos
        run: |
          make clean
          make package FINALPACKAGE=1
          mkdir -p output
          find .theos/obj -name "*.dylib" -exec cp {} output/VideoStarTool.dylib \;
          find packages -name "*.deb" -exec cp {} output/ \; 2>/dev/null || true

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-Output
          path: output/
