name: Build VideoStarTool

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build dylib + deb (portable)
    runs-on: macos-latest
    timeout-minutes: 40

    env:
      THEOS: ${{ github.workspace }}/theos
      PKG_NAME: VideoStarTool
      PKG_VERSION: 1.0.0
      PKG_ID: com.yourname.videostartool
      PKG_ARCH: iphoneos-arm64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # -------------------------------------------------------------
      # 1) Cache Theos
      # -------------------------------------------------------------
      - name: Cache Theos
        id: cache-theos
        uses: actions/cache@v4
        with:
          path: ${{ github.workspace }}/theos
          key: theos-${{ runner.os }}-${{ runner.arch }}-v3

      # -------------------------------------------------------------
      # 2) Cài Theos (chỉ để lấy toolchain + headers, KHÔNG dùng make package)
      # -------------------------------------------------------------
      - name: Install Theos
        if: steps.cache-theos.outputs.cache-hit != 'true'
        run: |
          set -e
          git clone --recursive --depth 1 https://github.com/theos/theos.git "$THEOS"
          echo "$THEOS/bin" >> "$GITHUB_PATH"

      - name: Add Theos to PATH (cache hit)
        if: steps.cache-theos.outputs.cache-hit == 'true'
        run: echo "$THEOS/bin" >> "$GITHUB_PATH"

      # -------------------------------------------------------------
      # 3) SDK
      # -------------------------------------------------------------
      - name: Install Theos SDK
        run: |
          set -e
          mkdir -p "$THEOS/sdks"
          if [ ! -d "$THEOS/sdks/iPhoneOS16.5.sdk" ] && \
             [ ! -d "$THEOS/sdks/iPhoneOS18.0.sdk" ]; then
            if curl -fsSL -o /tmp/sdk.tar.xz \
                "https://github.com/theos/sdks/releases/latest/download/iPhoneOS16.5.sdk.tar.xz"; then
              tar -xJf /tmp/sdk.tar.xz -C "$THEOS/sdks"
            else
              SDK=$(xcrun --sdk iphoneos --show-sdk-path)
              VER=$(xcrun --sdk iphoneos --show-sdk-version)
              cp -R "$SDK" "$THEOS/sdks/iPhoneOS${VER}.sdk"
            fi
          fi
          ls -1 "$THEOS/sdks"

      # -------------------------------------------------------------
      # 4) Build tools
      # -------------------------------------------------------------
      - name: Install build tools
        run: |
          set -e
          brew install ldid xz dpkg make
          echo "$(brew --prefix dpkg)/bin" >> "$GITHUB_PATH"
          echo "$(brew --prefix make)/libexec/gnubin" >> "$GITHUB_PATH"

      # -------------------------------------------------------------
      # 5) Build trực tiếp bằng clang → .dylib
      #    (không dùng make package, không THEOS_PACKAGE_SCHEME)
      # -------------------------------------------------------------
      - name: Build dylib with clang
        run: |
          set -e
          SDK="$THEOS/sdks/iPhoneOS16.5.sdk"
          [ -d "$SDK" ] || SDK=$(ls -d "$THEOS"/sdks/iPhoneOS*.sdk | sort -V | tail -1)
          echo "Using SDK: $SDK"

          # Toolchain của Theos (clang + ld64 + ldid)
          TOOLCHAIN="$THEOS/toolchain/linux/iphone/bin"
          [ -d "$TOOLCHAIN" ] || TOOLCHAIN="$THEOS/toolchain/darwin/iphone/bin"
          [ -d "$TOOLCHAIN" ] || TOOLCHAIN="$(dirname "$(xcrun -f clang)")"
          echo "Using toolchain: $TOOLCHAIN"

          mkdir -p out

          # Compile + link thẳng ra dylib, dùng sysroot của SDK
          "$TOOLCHAIN/clang" \
            -arch arm64 -arch arm64e \
            -isysroot "$SDK" \
            -miphoneos-version-min=14.0 \
            -fobjc-arc \
            -dynamiclib \
            -install_name "/Library/MobileSubstrate/DynamicLibraries/$PKG_NAME.dylib" \
            -framework UIKit -framework Foundation \
            -framework AVFoundation -framework CoreImage -framework PhotosUI \
            -I "$THEOS/include" \
            -I "$THEOS/vendor/include" \
            -L "$THEOS/lib" \
            -undefined dynamic_lookup \
            VideoStarTool.m \
            -o "out/$PKG_NAME.dylib"

          # Ký ad-hoc
          ldid -S "out/$PKG_NAME.dylib"

          # Filter plist cho MobileSubstrate
          cat > "out/$PKG_NAME.plist" <<EOF
          { Filter = { Bundles = ( "com.frontierdesign.videostar" ); }; }
          EOF

          echo "=== Built ==="
          file "out/$PKG_NAME.dylib"
          lipo -info "out/$PKG_NAME.dylib" || true

      # -------------------------------------------------------------
      # 6) Đóng gói .deb thủ công bằng dpkg-deb
      #    Layout: dùng cả 2 path → cài đâu cũng chạy (rootful + rootless)
      # -------------------------------------------------------------
      - name: Package .deb (portable layout)
        run: |
          set -e
          ROOT="pkgroot"
          rm -rf "$ROOT"
          mkdir -p "$ROOT/DEBIAN"

          # --- rootful path ---
          mkdir -p "$ROOT/Library/MobileSubstrate/DynamicLibraries"
          cp "out/$PKG_NAME.dylib" "$ROOT/Library/MobileSubstrate/DynamicLibraries/"
          cp "out/$PKG_NAME.plist" "$ROOT/Library/MobileSubstrate/DynamicLibraries/"

          # --- rootless path (/var/jb) ---
          mkdir -p "$ROOT/var/jb/Library/MobileSubstrate/DynamicLibraries"
          cp "out/$PKG_NAME.dylib" "$ROOT/var/jb/Library/MobileSubstrate/DynamicLibraries/"
          cp "out/$PKG_NAME.plist" "$ROOT/var/jb/Library/MobileSubstrate/DynamicLibraries/"

          # --- control ---
          INSTALLED_SIZE=$(du -sk "$ROOT" | cut -f1)
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: $PKG_ID
          Name: $PKG_NAME
          Version: $PKG_VERSION
          Architecture: $PKG_ARCH
          Description: 4 chuc nang tu dong cho Video Star 14.3.3
          Maintainer: yourname
          Author: yourname
          Section: Tweaks
          Depends: mobilesubstrate
          Installed-Size: $INSTALLED_SIZE
          EOF

          # --- postinst: chọn path theo môi trường, xoá path còn lại ---
          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e
          if [ -d /var/jb ]; then
            # rootless: giữ /var/jb, xoá rootful path
            rm -rf /Library/MobileSubstrate/DynamicLibraries/VideoStarTool.dylib \
                   /Library/MobileSubstrate/DynamicLibraries/VideoStarTool.plist 2>/dev/null || true
          else
            # rootful: giữ /, xoá /var/jb path
            rm -rf /var/jb/Library/MobileSubstrate/DynamicLibraries/VideoStarTool.dylib \
                   /var/jb/Library/MobileSubstrate/DynamicLibraries/VideoStarTool.plist 2>/dev/null || true
          fi
          exit 0
          EOF
          chmod 0755 "$ROOT/DEBIAN/postinst"

          # --- build deb ---
          mkdir -p packages
          dpkg-deb -Zgzip -b "$ROOT" "packages/${PKG_NAME}_${PKG_VERSION}_${PKG_ARCH}.deb"

          echo "==== PACKAGES ===="
          ls -la packages/
          dpkg-deb -I "packages/${PKG_NAME}_${PKG_VERSION}_${PKG_ARCH}.deb"

      # -------------------------------------------------------------
      # 7) Upload artifact
      # -------------------------------------------------------------
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: VideoStarTool-portable
          path: |
            packages/*.deb
            out/*.dylib
            out/*.plist
          if-no-files-found: error
          retention-days: 30

      # -------------------------------------------------------------
      # 8) Release nếu push tag v*
      # -------------------------------------------------------------
      - name: Attach to Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: packages/*.deb
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
