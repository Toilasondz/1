name: Build

on: [push, pull_request, workflow_dispatch]

jobs:
  build:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          git clone --recursive --depth 1 https://github.com/theos/theos.git $HOME/theos
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          brew install ldid xz dpkg make
          echo "$(brew --prefix dpkg)/bin" >> $GITHUB_PATH
          echo "$(brew --prefix make)/libexec/gnubin" >> $GITHUB_PATH
          mkdir -p $HOME/theos/sdks
          SDK=$(xcrun --sdk iphoneos --show-sdk-path)
          cp -R "$SDK" "$HOME/theos/sdks/iPhoneOS$(xcrun --sdk iphoneos --show-sdk-version).sdk"

      - name: Build
        env:
          THEOS: ${{ github.workspace }}/../theos
        run: |
          export THEOS=$HOME/theos
          make package FINALPACKAGE=1 THEOS_PACKAGE_SCHEME=rootless

      - uses: actions/upload-artifact@v4
        with:
          name: deb
          path: packages/*.deb
